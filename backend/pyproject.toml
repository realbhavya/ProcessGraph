[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "processgraph-sentinel-backend"
version = "0.1.0"
description = "Backend foundation for ProcessGraph Sentinel"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "falkordb>=1.2,<2.0",
  "mcp>=1.28,<2.0",
  "pydantic-settings>=2.6,<3.0",
  "pandas>=2.2,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pyreadr>=0.5,<1.0",
  "asyncua>=1.1,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
